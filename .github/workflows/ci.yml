name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Decision evaluation on synthetic data
        run: |
          python manage.py seed-synthetic --end 2026-11-08
          python ../evaluation/scripts/build_test_set.py
          python ../evaluation/scripts/run_eval.py --pipeline 3

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit -p packages/shared
      - run: npx tsc --noEmit -p apps/web
      - run: npx tsc --noEmit -p apps/mobile
      - run: npx vitest run
        working-directory: packages/shared
      - run: npx vitest run
        working-directory: apps/web
      - run: npm run build -w apps/web
